<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>S3 화면 시험틀</title>
<link rel="stylesheet" href="../../common/cozy.css">
<link rel="stylesheet" href="../style.css">
</head>
<body class="dark playing">
<!-- 베니 서바이벌 shell 없이 core + ui 만 붙여 화면을 시험하는 틀 (?g=<id>&n=<인원>&seed=<씨앗>) · 시험 전용 -->
<section class="play" id="play">
  <div class="bar"><button class="iconbtn" id="backBtn">‹</button><div class="mid"><span class="lbl" id="playTitle"></span><span class="t" id="playSub"></span></div></div>
  <div class="sv-seats" id="seatBar"></div>
  <main class="stage sv-stage" id="stage"></main>
  <div class="dock" id="dock">
    <button id="coachBtn"><span class="ic">🧑‍🏫</span><span>AI 선생님</span></button>
    <button id="ruleBtn2"><span class="ic">❓</span><span>규칙</span></button>
    <button id="againBtn"><span class="ic">↺</span><span>새 판</span></button>
  </div>
</section>
<div id="tutStage" class="stage" style="position:fixed;left:-9999px;top:0;width:360px"></div>
<script>
(() => {
  const q = new URLSearchParams(location.search), id = q.get("g"), seed = +q.get("seed") || 1;
  const load = src => new Promise((ok, err) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => err(new Error("load " + src)); document.head.appendChild(s); });
  window.__ready = false; window.__errors = [];
  addEventListener("error", e => window.__errors.push(String(e.message)));
  (async () => {
    await load(`../games/${id}/core.js`); await load(`../games/${id}/ui.js`);
    const C = window.SVCores[id], U = window.SVUI[id];
    const n = +q.get("n") || U.defN, tiers = ["hard", "normal", "easy"];
    const seats = []; for (let i = 0; i < n; i++) seats.push(i === 0 ? { kind: "human", name: "나", emoji: "🙂" } : { kind: "ai", tier: tiers[i % 3], name: "AI" + i, emoji: "🤖" });
    const cfg = {}; for (const [k, v] of q.entries()) if (k.startsWith("cfg_")) cfg[k.slice(4)] = isNaN(+v) ? v : +v;
    let st = C.init({ n, seed, cfg }), ME = +(q.get("me") || 0), g = 1, stopAuto = false, lastErr = "";
    const rnd = (() => { let a = seed * 7919 + 13; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();
    const stage = document.getElementById("stage");
    function settle() {
      let guard = 0;
      while (!C.over(st) && guard++ < 6000) {
        const need = C.needs(st);
        if (!need.length) { if (C.auto(st) == null) break; if (stopAuto) break; C.advance(st); continue; }
        const bots = need.filter(s => s !== ME);
        if (!bots.length) break;
        for (const s of bots) {
          const a = C.ai(C.view(st, s), s, seats[s].tier, rnd), r = C.apply(st, s, a);
          if (!r.ok) { window.__errors.push(`AI 가 규칙을 어김 (자리 ${s}): ${JSON.stringify(a)} → ${r.err}`); return; }
        }
      }
    }
    function render() {
      const V = C.view(st, ME);
      document.getElementById("playTitle").textContent = `${U.emoji} ${U.name}`;
      document.getElementById("playSub").textContent = U.sub ? U.sub(V, ME) : "";
      document.getElementById("seatBar").innerHTML = seats.map((s, i) => { const c = U.chip ? U.chip(V, i, ME) : {}; return `<div class="sv-seat${c.on ? " on" : ""}${c.out ? " out" : ""}${i === ME ? " me" : ""}"><span class="av">${s.emoji}</span><span class="nm">${s.name}</span><span class="pt">${c.t || ""}</span></div>`; }).join("");
      const canAct = ME >= 0 && !!(V.needs && V.needs.includes(ME)) && !V.over;
      try { U.render(stage, V, { me: ME, act, canAct, seats, mode: "solo", fast: false, coachOn: false, g, wait: false, sfx() {}, toast(m) { lastErr = m; } }); }
      catch (e) { window.__errors.push("render: " + (e.stack || e.message)); }
    }
    function act(a) { const r = C.apply(st, ME, a); if (!r.ok) { lastErr = r.err || "?"; window.__lastErr = lastErr; return r; } settle(); render(); return r; }
    window.__h = {
      C, U, ME, seats, st: () => st, act, render, rnd,
      view: () => C.view(st, ME),
      next() { if (C.needs(st).length === 0 && C.auto(st) != null) { C.advance(st); settle(); render(); return true; } return false; },
      hold(v) { stopAuto = !!v; },
      coach() { const V = C.view(st, ME); return U.coach(V, ME, -1, seats.map(s => s.name)); },
      result() { return U.result ? U.result(C.view(st, ME), ME) : ""; },
      lastErr: () => window.__lastErr || lastErr,
      tutorial() { return U.tutorial(); },
      tut(i) {
        const steps = U.tutorial(), s = steps[i], box = document.getElementById("tutStage");
        window.__tutDone = false; box.innerHTML = ""; box.onclick = null;
        try {
          if (s.render) s.render(box, { complete() { window.__tutDone = true; }, sfx() {}, toast() {} });
          else box.innerHTML = s.boardHtml || "";
        } catch (e) { window.__errors.push(`tutorial ${i}: ` + (e.stack || e.message)); }
        return { tag: s.tag, title: s.title, interactive: !!s.interactive, html: box.innerHTML.length, count: steps.length };
      },
      tutDone: () => window.__tutDone || false,
    };
    settle(); render();
    window.__ready = true;
  })().catch(e => window.__errors.push("boot: " + (e.stack || e.message)));
})();
</script>
</body>
</html>
