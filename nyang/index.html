<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a100a">
<title>냥도쿠</title>
<link rel="stylesheet" href="../common/cozy.css?v=14">
<script src="../common/fit.js?v=1"></script>
<script src="../common/backnav.js?v=3"></script>
<link rel="stylesheet" href="style.css?v=1">
<!-- 카톡 안 브라우저에 냥도쿠 기록이 쌓여 있으면 기본 브라우저로 넘기지 않음 (cozy.js 가 넘기면 그 기록이 안 보임: 저장 칸이 브라우저마다 따로) -->
<script>try{if(/KAKAOTALK/i.test(navigator.userAgent)&&["stageStars","solved","bestT","taBest"].some(k=>localStorage.getItem("nyang."+k)))sessionStorage.setItem("cozy.kakaoOut","1")}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="logo" aria-hidden="true">🐱</span>냥도쿠</h1>
    <a href="../">게임 목록</a>
  </header>

  <section id="home" class="card">
    <div class="tabs" role="tablist">
      <button class="btn" id="tabSolo" aria-pressed="true">혼자</button>
      <button class="btn" id="tabFriend" aria-pressed="false">친구랑</button>
      <button class="btn" id="tabWatch" aria-pressed="false">AI 구경</button>
    </div>

    <!-- 혼자: 단계 지도 · 한 판 · 타임어택 -->
    <div id="soloBox" class="box">
      <div class="progcard" id="soloProg"></div>
      <div class="seg center" id="soloMode"></div>
      <p class="lede center" id="soloDesc" hidden></p>
      <div class="tiers" id="tiers"></div>
      <div id="stageBox" hidden></div>
      <ul class="howto" id="howto">
        <li>색 묶음마다, 가로줄·세로줄마다 고양이 한 마리씩</li>
        <li>고양이끼리는 대각선으로도 붙으면 안 돼요</li>
        <li>한 번 누르면 ✕ 표시, 두 번 빠르게 누르면 🐱</li>
        <li>정답이 아닌 칸에 놓으면 🐟를 잃어요 (3번이면 실패)</li>
      </ul>
      <button class="btn primary big" id="startBtn">시작!</button>
    </div>

    <!-- AI 구경 -->
    <div id="watchBox" class="box" hidden>
      <p class="lede">🧠 AI가 사람처럼 하나씩 따져 가며 푸는 모습을 봐요. 한 수마다 왜 그렇게 했는지 알려 줘요.</p>
      <div class="wctl">
        <select id="wTier"><option value="easy">🐣 초급</option><option value="normal">🐱 중급</option><option value="hard">🐯 고급</option><option value="master">👑 고수</option></select>
        <button class="btn" id="wNew">다음 판</button>
      </div>
      <div class="wstage-wrap">
        <div class="wtop"><span class="pill" id="wCats">🐱 0</span><span class="pill" id="wSteps">0수</span></div>
        <div id="wStage"></div>
        <div class="wsay" id="wSay"></div>
      </div>
      <div class="seg center" id="wSpeed"></div>
      <div class="wctl center"><button class="btn primary big" id="wPlay">▶ 보기</button><button class="btn big" id="wStep">한 수씩</button></div>
    </div>

    <div class="row center minor">
      <button class="btn ghost" id="helpBtn">❓ 하는 법</button>
      <button class="btn ghost" id="rankBtn">🏆 랭킹</button>
    </div>
  </section>
</div>

<!-- 게임 (화면 한 장 · 혼자·대결 똑같음) -->
<section class="play" id="play" hidden>
  <div class="bar"><button class="iconbtn" id="giveUp" aria-label="나가기">‹</button><div class="mid"><span class="lbl" id="stLabel"></span><span class="t" id="timer">0:00</span></div><span class="pill" id="fish"></span></div>
  <div class="catstrip" id="catStrip"></div>
  <div class="opp" id="opp" hidden></div>
  <div class="boardwrap" id="boardwrap">
    <div id="board"></div>
    <button class="btn primary peek" id="resPeek" hidden>🏆 결과 다시 보기</button>
  </div>
  <div class="hintbox" id="hintBox" hidden><p id="hintText"></p><div class="row"><button class="btn" id="hintMore">이유 보기</button><button class="btn primary" id="hintApply" hidden>적용</button><button class="btn ghost" id="hintClose">닫기</button></div></div>
  <div class="dock" id="dock">
    <button id="hintBtn"><span class="ic">💡<span class="badge" id="hintBadge" hidden></span></span><span>힌트</span></button>
    <button id="autoX" aria-pressed="false"><span class="ic">🪄</span><span>자동 ✕</span></button>
    <button id="clearX"><span class="ic">🧽</span><span>✕ 지우기</span></button>
    <button id="restart"><span class="ic">↺</span><span>처음부터</span></button>
    <button id="chatBtn" hidden><span class="ic">💬<span class="badge" id="chatBadge" hidden>●</span></span><span>채팅</span></button>
    <button id="sndBtn"><span class="ic">🔊</span><span>소리 켬</span></button>
  </div>
</section>
<div class="overlay" id="spyBox" hidden><div class="spy"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="iconbtn sm" id="spyPrev" aria-label="이전 친구">‹</button><div style="display:grid;line-height:1.3"><b class="round" id="spyName" style="font-size:19px"></b><span class="small" id="spyStat"></span></div><button class="iconbtn sm" id="spyNext" aria-label="다음 친구">›</button></div><div class="wboard spyb" id="spyBoard"></div><div class="row"><button class="btn primary" id="spyClose" data-x>닫기</button></div></div></div>
<div class="combo" id="comboPop" hidden></div>
<div class="overlay" id="countBox" hidden><div class="countwrap"><div class="count" id="count">3</div></div></div>
<div class="overlay" id="resBox" hidden><div><h2 id="resTitle"></h2><div id="resBody" style="display:grid;gap:8px"></div><div class="row" id="resBtns"></div></div></div>
<div class="overlay" id="rankBox" hidden><div class="rankwin">
  <button class="iconbtn sm" data-x id="rankClose" aria-label="닫기">✕</button>
  <h2>🏆 랭킹</h2>
  <div class="meline" id="meCard"></div>
  <div id="rkShared"></div>
  <h3>🏅 퍼즐 최고 기록 (시간·타임어택)</h3>
  <p class="small">판 수·승패·승점은 위 랭킹이에요. 여기는 퍼즐을 가장 빨리·가장 많이 푼 기록만 따로 모아요.</p>
  <div class="rktabs" id="rkKind"></div>
  <div class="rkopts"><span class="chips" id="rkTier"></span><span class="chips" id="rkMins"></span></div>
  <ol class="list rklist" id="rkList"></ol>
  <p class="small" id="rkNote" style="margin:0;text-align:center"></p>
  <button class="btn" id="gRankBtn">🏆 전체 게임 랭킹</button>
</div></div>

<script src="../common/glog.js?v=6"></script>
<script src="../common/cozy.js?v=12"></script>
<script src="../common/me.js?v=14"></script>
<script src="../common/rank.js?v=10"></script>
<script src="../common/arena-mock.js?v=9"></script>
<script src="../common/arena.js?v=13"></script>
<script src="../common/arena-ui.js?v=16"></script>
<script src="core.js?v=5"></script>
<script src="sound.js?v=4"></script>
<script src="main.js?v=24"></script>
<script src="watch.js?v=7"></script>
</body>
</html>
