<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<title>냥도쿠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 냥도쿠: 크림색 바탕 · 둥근 글꼴 · 파스텔 판. 게임 중에는 화면 한 장(스크롤 없음)에 상태줄·판·단추가 다 들어가게 */
:root{
  --bg:#fff6ea; --card:#ffffff; --ink:#5b4636; --soft:#9a8270; --line:#f0dfcc;
  --accent:#ff9a7a; --accent2:#7cc9b4; --gold:#f5b942; --bad:#f2647e; --good:#3fae7a;
  --board:#8a6a55; --x:#8a6a55; --shadow:0 6px 18px rgba(140,98,70,.14);
  --round:"Jua","Gowun Dodum",system-ui,sans-serif; --text:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--text)}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:#d9785b}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3,.round{font-family:var(--round);font-weight:400;margin:0}
header.top{display:flex;align-items:center;gap:10px}
header.top h1{font-size:30px;letter-spacing:.5px}
header.top a{margin-left:auto;font-size:13px;text-decoration:none;background:var(--card);padding:6px 12px;border-radius:99px;box-shadow:var(--shadow);color:var(--soft)}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.lede{margin:0;color:var(--soft);font-size:14px}
.btn{font:16px/1 var(--round);padding:11px 16px;border-radius:99px;border:0;background:#fff1e3;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #ecd8c2;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #e07a5c}
.btn.mint{background:var(--accent2);color:#fff;box-shadow:0 3px 0 #5aa892}
.btn.ghost{background:transparent;box-shadow:none;color:var(--soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 2px 0 #3d2d22}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:6px;background:#fbe9d7;padding:5px;border-radius:99px}
.tabs .btn{flex:1;padding:10px 6px;font-size:15px;box-shadow:none;background:transparent}
.tabs .btn[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(140,98,70,.15)}
/* 난이도 고르기 */
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tier{border:0;border-radius:20px;padding:16px 14px;text-align:left;cursor:pointer;display:grid;gap:4px;font:inherit;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.06)}
.tier .em{font-size:34px;line-height:1}
.tier b{font:22px/1.1 var(--round)}
.tier span{font-size:12.5px;color:#7d6656}
.tier:active{transform:translateY(2px)}
.t-easy{background:#e3f4e6}.t-normal{background:#fff0c9}.t-hard{background:#ffe0d6}.t-master{background:#eadff8}
.howto{margin:0;padding-left:18px;color:var(--soft);font-size:13.5px;display:grid;gap:2px}
/* 친구랑 */
input[type=text]{font:16px var(--text);background:#fffaf4;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1 1 150px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:#fffaf4;border:2px solid var(--line)}
.list .cd{font:20px/1 var(--round);letter-spacing:.1em;color:var(--accent)}
.list .inf{flex:1;min-width:120px}
.list li.empty{opacity:.6;border-style:dashed}
.list li.none{justify-content:center;color:var(--soft);border-style:dashed}
.small{font-size:12.5px;color:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{padding:9px 13px;font-size:14.5px}
.chat .log{height:110px;overflow:auto;background:#fffaf4;border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-size:14px}
.chat .log b{color:#d9785b}

/* ── 게임 화면: 화면 한 장 (혼자·대결 똑같음) ── */
body.playing{overflow:hidden;height:100dvh;padding:0}
body.playing .wrap{display:none}
#play{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);max-width:620px;margin:0 auto}
.bar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font:20px/1 var(--round);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.bar .mid{display:grid;justify-items:center;line-height:1.15}
.bar .lbl{font:19px var(--round)}
.bar .t{font:15px var(--round);color:var(--soft);font-variant-numeric:tabular-nums}
.pill{background:var(--card);border-radius:99px;padding:7px 11px;box-shadow:var(--shadow);white-space:nowrap;font-size:18px;letter-spacing:1px}
.pill .gone{filter:grayscale(1);opacity:.22}
.catstrip{display:flex;justify-content:center;flex-wrap:nowrap;gap:5px;background:var(--card);border-radius:99px;padding:6px 10px;box-shadow:var(--shadow);align-self:center;max-width:100%}
.catstrip i{flex:0 1 26px;min-width:0;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px;transition:transform .2s}
.catstrip i span{opacity:.18;filter:grayscale(1)}
.catstrip i.on span{opacity:1;filter:none}.catstrip i.on{transform:scale(1.08)}
.opp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:34px}
.opp .p{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:5px 10px 5px 5px;box-shadow:var(--shadow);font-size:13px}
.opp .p .av{width:24px;height:24px;border-radius:50%;background:#ffe3d6;display:grid;place-items:center;font:13px var(--round)}
.opp .p.me .av{background:var(--accent);color:#fff}
.opp .p b{font:14px var(--round);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .p .pb{width:46px;height:7px;border-radius:4px;background:#f6e6d6;overflow:hidden}.opp .p .pb>i{display:block;height:100%;background:var(--accent2);border-radius:4px;transition:width .25s}
.opp .p.done{background:#e3f4e6}.opp .p.fail{opacity:.55}
.boardwrap{flex:1;min-height:0;display:grid;justify-items:center;align-items:start;position:relative}
#board{display:grid;width:var(--bs,300px);height:var(--bs,300px);padding:var(--gp,6px);gap:var(--gp,6px);border-radius:22px;background:#fff;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
#board .c{position:relative;display:grid;place-items:center;cursor:pointer;line-height:1;padding:0;border:0;color:var(--x);font-size:calc(var(--bs,300px) / var(--n,8) * .56);border-radius:calc(var(--bs,300px) / var(--n,8) * .2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
#board .c>span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.35);transition:opacity .16s, transform .22s cubic-bezier(.3,1.6,.5,1)}
#board .c.has-cat .cat,#board .c.has-x .x{opacity:1;transform:scale(1)}
#board .c .x{color:rgba(100,68,48,.7);transition-duration:.12s}
#board .c .x svg{width:68%;height:68%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
#board .c.bad::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.45)}
#board .c.bad .x{color:var(--bad)}
#board .c.bad .x svg{width:76%;height:76%;stroke-width:1.8}
#board .c .cat{font-size:.95em}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.12)}to{transform:scale(1)}}
#board .c.look{animation:look 1s ease-in-out infinite}
@keyframes look{50%{filter:brightness(1.12) saturate(1.4);transform:scale(1.05)}}
#board .c.tgt{outline:3px solid #e0703f;outline-offset:-3px}
#board .c.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dock{display:flex;justify-content:center;gap:12px;flex-wrap:nowrap}
.dock button{display:grid;justify-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:12px var(--text)}
.dock button .ic{width:54px;height:54px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px;position:relative;transition:transform .08s}
.dock button:active .ic{transform:scale(.93)}
.dock button[aria-pressed="true"] .ic{background:var(--ink);color:#fff}
.dock button:disabled{opacity:.35}
.dock .badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font:12px/20px var(--round);padding:0 5px}
.hintbox{position:absolute;left:0;right:0;bottom:4px;margin:0 auto;width:min(100%,520px);background:#fffbe8;border-radius:20px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 12px 34px rgba(140,98,70,.3);z-index:5}
.hintbox p{margin:0;font-size:15px}
.hintbox .row .btn{padding:9px 14px;font-size:15px}.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:rgba(91,70,54,.35);padding:16px}
.overlay>div{background:var(--card);border-radius:24px;padding:20px;width:min(420px,100%);display:grid;gap:12px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(91,70,54,.3);text-align:center}
.overlay h2{font-size:26px}
.overlay .row{justify-content:center}
#count{font:96px/1 var(--round);color:var(--accent);background:none;box-shadow:none;text-shadow:0 4px 0 #ffd9c9}
table.rank{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
table.rank td,table.rank th{padding:6px;border-bottom:2px solid #f6eadf}
table.rank th{font-weight:400;color:var(--soft);font-size:12.5px}
table.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
/* AI 구경: 판은 고정 정사각형, 칸 안의 ✕·🐱는 미리 넣어 두고 보였다 숨겼다 (크기 안 바뀜, 부드럽게) */
.wstage-wrap{display:grid;gap:10px;justify-items:center}
.wtop{display:flex;gap:8px;justify-content:center}.wtop .pill{font:16px var(--round);letter-spacing:0}
#wStage{width:min(100%,440px)}
.wrun{background:#fffaf4;border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;border:2px solid var(--line);transition:border-color .3s}
.wrun.finished{border-color:#b9e3c9}
.whead{display:grid;gap:1px;min-height:38px}
.whead b{font:16px var(--round)}
.wboard{display:grid;width:100%;aspect-ratio:1;padding:5px;gap:4px;border-radius:20px;background:#fff;box-shadow:var(--shadow);contain:layout}
.wboard .c{position:relative;border-radius:22%;overflow:hidden;transition:filter .25s, transform .25s}
.wboard .c>span{position:absolute;inset:0;display:grid;place-items:center;line-height:1;opacity:0;transform:scale(.4);transition:opacity .25s, transform .25s cubic-bezier(.3,1.6,.5,1)}
.wboard{container-type:inline-size}
.wboard .c>span{font-size:calc(100cqw / var(--n) * .7)}
.wboard .c .x{color:rgba(110,78,58,.5);font-family:var(--round);font-size:calc(100cqw / var(--n) * .4)}
.wboard .c.has-cat .cat,.wboard .c.has-x .x{opacity:1;transform:scale(1)}
.wboard .c.look{filter:brightness(1.12) saturate(1.35)}
.wboard .c.tgt{transform:scale(.88);box-shadow:0 0 0 2px #e0703f}
.wboard .c.back{filter:grayscale(.6)}
.wstat{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-variant-numeric:tabular-nums}
.wstat span{display:grid;background:var(--card);border-radius:10px;padding:4px 8px}
.wstat i{font-style:normal;font-size:11.5px;color:var(--soft);white-space:nowrap}
.wstat b{color:var(--ink);font-family:var(--round);font-weight:400;font-size:18px;line-height:1.1}
.badn{color:var(--bad)!important}
.wsay{width:min(100%,440px);height:5.2em;overflow:hidden;font-size:14.5px;line-height:1.55;background:#fffbe8;border-radius:16px;padding:9px 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;box-shadow:var(--shadow)}
.wsum{margin:0;text-align:center;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);font-size:14.5px}
.wctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;align-items:center;gap:8px;font:16px var(--round);font-variant-numeric:tabular-nums}
.iconbtn.sm{width:36px;height:36px;font-size:18px}
@media (max-width:420px){#wRuns{gap:8px}.wrun{padding:7px}.wsay{font-size:12px}.whead{min-height:0}.whead .small{display:none}}select{font:15px var(--round);background:#fff1e3;color:var(--ink);border:0;border-radius:99px;padding:9px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🐱 냥도쿠</h1>
    <a href="../">게임 목록</a>
  </header>

  <!-- 시작 화면 -->
  <section id="home" class="card">
    <div class="tabs" role="tablist">
      <button class="btn" id="tabSolo" aria-pressed="true">혼자 하기</button>
      <button class="btn" id="tabVs" aria-pressed="false">친구랑 대결</button>
      <button class="btn" id="tabWatch" aria-pressed="false">AI 구경</button>
    </div>
    <div id="soloBox" style="display:grid;gap:12px">
      <div class="tiers" id="tiers"></div>
      <ul class="howto">
        <li>색 묶음마다, 가로줄·세로줄마다 고양이 한 마리씩</li>
        <li>고양이끼리는 대각선으로도 붙으면 안 돼요</li>
        <li>한 번 누르면 ✕ 표시, 두 번 빠르게 누르면 🐱</li>
        <li>정답이 아닌 칸에 놓으면 🐟를 잃어요 (3번이면 실패)</li>
      </ul>
    </div>
    <div id="vsBox" hidden style="display:grid;gap:10px">
      <div class="row"><input id="name" class="grow" type="text" maxlength="12" placeholder="내 이름 (12자까지)" autocomplete="nickname"><button class="btn primary" id="mkRoom">방 만들기</button></div>
      <div class="row"><input id="code" class="grow" type="text" maxlength="4" placeholder="방 코드 4자리" style="text-transform:uppercase"><button class="btn" id="joinCode">들어가기</button></div>
      <div class="row" style="justify-content:space-between"><h3>열린 방</h3><button class="btn ghost" id="refresh">↻ 새로고침</button></div>
      <ul class="list" id="rooms"><li class="none">불러오는 중…</li></ul>
    </div>
    <div id="watchBox" hidden style="display:grid;gap:12px">
      <p class="lede">🧠 AI가 사람처럼 하나씩 따져 가며 푸는 모습을 봐요. 한 수마다 왜 그렇게 했는지 알려 줘요.</p>
      <div class="wctl">
        <select id="wTier"><option value="easy">🐣 초급</option><option value="normal">🐱 중급</option><option value="hard">🐯 고급</option><option value="master">👑 고수</option></select>
        <button class="btn" id="wNew">다음 판</button>
      </div>
      <div class="wstage-wrap">
        <div class="wtop"><span class="pill" id="wCats">🐱 0</span><span class="pill" id="wSteps">0수</span></div>
        <div id="wStage"></div>
        <div class="wsay" id="wSay"></div>
      </div>
      <div class="wctl" style="justify-content:center"><button class="btn primary" id="wPlay">▶ 보기</button><button class="btn" id="wStep">한 수씩</button></div>
      <div class="seg" id="wSpeed" style="justify-content:center"></div>
    </div>  </section>

  <!-- 대기실 -->
  <section id="lobby" class="card" hidden>
    <div class="row"><h2 style="flex:1">대기실 · <span style="color:var(--accent)" id="lbCode"></span></h2><button class="btn" id="copyLink">초대 링크</button><button class="btn ghost" id="leave1">나가기</button></div>
    <ul class="list" id="lbPlayers"></ul>
    <div id="hostOpts" style="display:grid;gap:10px">
      <div><span class="small">난이도</span><div class="seg" id="cfgTier"></div></div>
      <div><span class="small">힌트</span><div class="seg" id="cfgHint"></div></div>
      <div><span class="small">판 수</span><div class="seg" id="cfgRounds"></div></div>
      <button class="btn primary" id="startVs" style="padding:14px;font-size:18px">시작!</button>
    </div>
    <p class="small" id="guestWait" hidden>방장이 시작하기를 기다리는 중… (<span id="cfgView"></span>)</p>
    <div class="chat" style="display:grid;gap:6px"><div class="log" id="chatLog"></div><div class="row"><input id="chatIn" class="grow" type="text" maxlength="120" placeholder="채팅"><button class="btn" id="chatSend">보내기</button></div></div>
  </section>
</div>

<!-- 게임 (화면 한 장 · 혼자·대결 똑같음) -->
<section id="play" hidden>
  <div class="bar"><button class="iconbtn" id="giveUp" aria-label="나가기">‹</button><div class="mid"><span class="lbl" id="stLabel"></span><span class="t" id="timer">0:00</span></div><span class="pill" id="fish"></span></div>
  <div class="catstrip" id="catStrip"></div>
  <div class="opp" id="opp" hidden></div>
  <div class="boardwrap" id="boardwrap">
    <div id="board"></div>
    <div class="hintbox" id="hintBox" hidden><p id="hintText"></p><div class="row"><button class="btn" id="hintMore">이유 보기</button><button class="btn primary" id="hintApply" hidden>적용</button><button class="btn ghost" id="hintClose">닫기</button></div></div>
  </div>
  <div class="dock">
    <button id="hintBtn"><span class="ic">💡<span class="badge" id="hintBadge" hidden></span></span><span>힌트</span></button>
    <button id="autoX" aria-pressed="false"><span class="ic">🪄</span><span>자동 ✕</span></button>
    <button id="clearX"><span class="ic">🧽</span><span>✕ 지우기</span></button>
    <button id="restart"><span class="ic">↺</span><span>처음부터</span></button>
    <button id="sndBtn"><span class="ic">🔊</span><span>소리 켬</span></button>
  </div>
</section>
<div class="overlay" id="countBox" hidden><div style="background:none;box-shadow:none"><div id="count">3</div></div></div>
<div class="overlay" id="resBox" hidden><div><h2 id="resTitle"></h2><div id="resBody"></div><div class="row" id="resBtns"></div></div></div>

<script src="../common/glog.js?v=1"></script>
<script src="core.js?v=3"></script>
<script src="net.js?v=3"></script>
<script src="sound.js?v=1"></script>
<script src="main.js?v=8"></script>
<script src="watch.js?v=6"></script>
</body>
</html>
