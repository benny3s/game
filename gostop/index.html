<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f4d27">
<title>고스톱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../common/cozy.css?v=13">
<script src="../common/fit.js?v=1"></script>
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>
<div class="wrap" id="home">
  <header class="top">
    <h1>🎴 고스톱</h1>
    <a href="../">게임 목록</a>
  </header>

  <section class="card" id="menuCard">
    <div class="tabs" role="tablist">
      <button class="btn" id="tabSolo" aria-pressed="true">혼자</button>
      <button class="btn" id="tabFriend" aria-pressed="false">친구랑</button>
      <button class="btn" id="tabLocal" aria-pressed="false">한 기기</button>
      <button class="btn" id="tabWatch" aria-pressed="false">AI 구경</button>
    </div>

    <div id="soloBox" class="box">
      <div class="coinline" id="coinLine"></div>
      <div class="seg center" id="modeSeg"></div>
      <p class="small center-note" id="modeNote" hidden></p>
      <div class="tiers three" id="tiers"></div>
      <div class="optrows">
        <div class="optrow"><span class="small">상대</span><div class="seg" id="foeSeg"></div></div>
        <div class="optrow"><span class="small">보너스 피</span><div class="seg" id="bonusSeg"></div></div>
        <div class="optrow"><span class="small">진행 속도</span><div class="seg" id="speedSeg"></div></div>
        <div class="optrow"><span class="small">AI 선생님</span><div class="seg" id="coachSeg"></div></div>
      </div>
      <ul class="howto" id="howto">
        <li>같은 달(같은 그림)끼리 짝을 맞춰 가져와요</li>
        <li>손패를 누르면 짝이 되는 바닥 패가 반짝, 한 번 더 누르면 내요</li>
        <li>광·열끗·띠·피를 모아 점수를 내요. 맞고는 7점, 셋이면 3점부터 고·스톱</li>
      </ul>
      <div class="ruleline" id="ruleLine1"></div>
      <button class="btn primary big" id="startBtn">시작하기</button>
      <button class="btn ghost" id="rulesBtn">📖 규칙 자세히 보기</button>
    </div>

    <div id="localBox" class="box" hidden>
      <p class="lede">폰·TV 하나로 2~5명이 돌려 가며 해요. 사람 차례가 되면 덮개가 나와서 앞사람의 패를 가려요.</p>
      <div class="optrow" id="lModeRow"><span class="small">사람 수</span><div class="seg" id="lModeSeg"></div></div>
      <div class="wseats" id="lSeats"></div>
      <div class="optrows">
        <div class="optrow"><span class="small">보너스 피</span><div class="seg" id="lBonusSeg"></div></div>
        <div class="optrow"><span class="small">진행 속도</span><div class="seg" id="lSpeedSeg"></div></div>
      </div>
      <div class="ruleline" id="ruleLine2"></div>
      <p class="small center-note" id="lNote"></p>
      <button class="btn primary big" id="localBtn">시작하기</button>
    </div>

    <div id="watchBox" class="box" hidden>
      <p class="lede">AI 타짜들끼리 패를 모두 공개하고 대국하는 모습을 관전합니다.</p>
      <div class="seg center" id="wModeSeg"></div>
      <div class="wseats" id="wSeats"></div>
      <div class="optrow"><span class="small">진행 속도</span><div class="seg" id="wSpeedSeg"></div></div>
      <div class="ruleline" id="ruleLine3"></div>
      <button class="btn primary big" id="watchBtn">관전 시작</button>
    </div>
  </section>
  <button class="btn ghost" id="replayBtn" hidden>🎞️ 지난 판 다시 보기</button>
  <button class="btn ghost" id="mistakeBtn" hidden style="width:100%;margin-top:8px">📒 아쉬운 장면</button>
  <button class="btn ghost" id="gRankBtn" style="width:100%;margin-top:8px">🏆 랭킹</button>
</div>

<!-- 게임 (화면 한 장) -->
<section class="play wide" id="play" hidden>
  <div class="bar">
    <button class="iconbtn" id="backBtn" aria-label="나가기">‹</button>
    <div class="mid"><span class="lbl" id="lbl"></span><span class="t" id="sub"></span></div>
    <span class="pill" id="coinPill"></span>
  </div>
  <div class="benchbar" id="benchBar" hidden></div>
  <div class="scorebar" id="scoreBar" hidden></div>
  <div class="stage" id="stage">
    <div class="zone opp" id="zOpp"></div>
    <div class="zone table" id="zTable"><span class="deckn" id="deckN"></span></div>
    <div class="zone mine" id="zMine"></div>
    <div class="zone hand" id="zHand"></div>
    <div class="layer" id="layer"></div>
    <div class="coach-bar" id="coachBar" hidden></div>
  </div>
  <div class="dock" id="dock">
    <button id="passBtn" class="mintbtn" hidden><span class="ic">🃏<span class="badge" id="passN">2</span></span><span>뒤집기만</span></button>
    <button id="coachBtn" aria-pressed="false"><span class="ic">🧑‍🏫</span><span>AI 선생님</span></button>
    <button id="loanBtn" aria-label="은행에서 빌리기" hidden><span class="ic">💰</span><span>빌리기</span></button>
    <button id="bankBtn" aria-label="은행 잔액·정산" hidden><span class="ic">🏦</span><span>은행</span></button>
    <button id="pauseBtn" hidden><span class="ic">⏸</span><span>멈춤</span></button>
    <button id="speedBtn"><span class="ic">🐢</span><span>보통</span></button>
    <button id="ruleBtn"><span class="ic">📖</span><span>규칙</span></button>
    <button id="sndBtn"><span class="ic">🔊</span><span>소리 켬</span></button>
  </div>
</section>

<div class="combo" id="pop" hidden></div>
<div class="overlay peek" id="goBox" hidden><div><h2 id="goTitle">고? 스톱?</h2><div id="goBody"></div><div class="row" id="goBtns"></div></div></div>
<div class="overlay" id="resBox" hidden><div><h2 id="resTitle"></h2><div id="resBig"></div><div id="resBody"></div><div class="row" id="resBtns"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script src="../common/cozy.js?v=11"></script>
<script src="../common/me.js?v=12"></script>
<script src="../common/rank.js?v=5"></script>
<script src="../common/arena-mock.js?v=7"></script>
<script src="../common/arena.js?v=11"></script>
<script src="../common/arena-ui.js?v=13"></script>
<script src="../common/bank.js?v=8"></script>
<script src="../common/coach.js?v=3"></script>
<script src="../common/hotseat.js?v=2"></script>
<script src="core.js?v=14"></script>
<script src="ai.js?v=7"></script>
<script src="cards.js?v=5"></script>
<script src="../common/mistakes.js?v=2"></script>
<script src="main.js?v=36"></script>
</body>
</html>
