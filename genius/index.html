<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f131d">
<title>베니 지니어스 — 흑과 백 · 결! 합! · 십이장기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../common/cozy.css?v=14">
<script src="../common/fit.js?v=1"></script>
<script src="../common/backnav.js?v=3"></script>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body class="dark">
<div class="wrap">
  <header class="top">
    <h1><span class="glogo" aria-hidden="true">🧠</span>베니 지니어스</h1>
    <a href="../">게임 목록</a>
  </header>

  <section id="home" class="card">
    <p class="g-subtitle">더 지니어스 · 데블스 플랜 두뇌 대결 모음</p>
    <div class="g-cards" id="gameCards" role="radiogroup" aria-label="지니어스 종목 선택">
      <button type="button" class="g-card" data-kind="bw" aria-pressed="true">
        <span class="ic">⬛⬜</span>
        <b>흑과 백</b>
        <small>색만 보이는 9라운드 심리전</small>
      </button>
      <button type="button" class="g-card" data-kind="gh" aria-pressed="false">
        <span class="ic">🔷</span>
        <b>결! 합!</b>
        <small>3가지 속성 조합 · 순발력</small>
      </button>
      <button type="button" class="g-card" data-kind="12" aria-pressed="false">
        <span class="ic">🦁</span>
        <b>십이장기</b>
        <small>포로 · 승급 · 적진 입성</small>
      </button>
    </div>

    <div class="tabs" role="tablist">
      <button class="btn" id="tabSolo" aria-pressed="true">혼자</button>
      <button class="btn" id="tabFriend" aria-pressed="false">친구랑</button>
      <button class="btn" id="tabWatch" aria-pressed="false">AI 구경</button>
    </div>

    <div id="soloBox" class="box">
      <div id="aiOpts" class="box">
        <div class="tiers three" id="tiers"></div>
      </div>
    </div>

    <div id="watchBox" class="box" hidden>
      <p class="lede">AI끼리 두뇌 대결하는 장면을 구경하며 전략을 익혀 보세요!</p>
      <div class="optrow"><span class="small">속도</span><div class="seg" id="watchSpeed">
        <button class="btn" data-spd="1350">🐢 천천히</button>
        <button class="btn active" data-spd="800">⚡ 보통</button>
        <button class="btn" data-spd="400">🚀 빠르게</button>
      </div></div>
    </div>

    <div class="g-brief" id="gameBrief"></div>

    <div class="g-cta">
      <button class="btn ghost" id="helpBtn">🎬 1분 규칙 설명</button>
      <button class="btn primary big" id="startBtn">시작!</button>
    </div>

    <div class="row center minor">
      <button class="btn ghost" id="gRankBtn">🏆 랭킹</button>
      <button class="btn ghost" id="coachHintBtn">🧑‍🏫 AI 선생님 안내</button>
    </div>
  </section>
</div>

<section class="play" id="play" hidden>
  <div class="bar">
    <button class="iconbtn" id="backBtn" aria-label="나가기">‹</button>
    <div class="mid">
      <span class="lbl" id="playTitle">흑과 백</span>
      <span class="t" id="playSub">1 / 9 라운드</span>
    </div>
    <button class="pill" id="sndBtn" aria-label="소리">🔊</button>
  </div>

  <div class="scores" id="scoreBar"></div>

  <main class="stage" id="stage"></main>

  <div id="coachSlot" class="coach-slot"></div>

  <div class="dock" id="dock">
    <button id="coachBtn"><span class="ic">🧑‍🏫</span><span>AI 선생님</span></button>
    <button id="helpPlayBtn"><span class="ic">🎬</span><span>규칙 설명</span></button>
    <button id="switchBtn"><span class="ic">🔀</span><span>종목 바꾸기</span></button>
    <button id="againBtn"><span class="ic">↺</span><span>새 판</span></button>
  </div>
</section>

<script src="../common/glog.js?v=8"></script>
<script src="../common/cozy.js?v=14"></script>
<script src="../common/me.js?v=19"></script>
<script src="../common/rank.js?v=14"></script>
<script src="../common/arena-mock.js?v=10"></script>
<script src="../common/arena.js?v=16"></script>
<script src="../common/arena-ui.js?v=20"></script>
<script src="../common/coach.js?v=4"></script>
<script src="../common/tutorial.js?v=2"></script>
<script src="core.js?v=3"></script>
<script src="tutorial.js?v=1"></script>
<script src="main.js?v=4"></script>
</body>
</html>
