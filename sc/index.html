<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>스타 대결</title>
<style>
/* 스타1 느낌: 어두운 우주 바닥 + 아래 콘솔(미니맵 · 선택 유닛 · 명령 버튼). 그림·소리는 전부 직접 만든 것 (블리자드 파일 없음) */
:root{--bg:#06080c;--panel:#10161d;--panel2:#18212b;--line:#2c3a48;--ink:#dfe8f0;--muted:#8796a5;--hi:#7bd88f;--warn:#f4c95d;--bad:#ff6b6b;--gold:#d8b25a;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
button,input,select{font:inherit}
.btn{background:linear-gradient(#26313d,#1a232c);color:var(--ink);border:1px solid #3b4c5e;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.go{background:linear-gradient(#3c6b3f,#274a2a);border-color:#5d9a61;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],select{background:#0b1015;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#122030,#05070a 70%)}
.box{background:rgba(14,20,27,.94);border:1px solid #3b4c5e;border-radius:10px;padding:18px;width:min(920px,100%);display:grid;gap:14px;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.6)}
h1{margin:0;font-size:24px;letter-spacing:.02em;color:var(--gold)}
h2{margin:0;font-size:15px;color:var(--gold);letter-spacing:.04em}
.small{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-checked=true]{border-color:#fff}
/* 대기실: 왼쪽 팀 칸 · 오른쪽 판 정보, 아래 채팅 */
.lobby{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:720px){.lobby{grid-template-columns:1fr}}
.panel{background:#0b1117;border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.slot{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid #1f2b37;border-radius:6px;background:#0f161d;font-size:14px}
.slot .c{width:14px;height:14px;border-radius:3px}
.slot.cpu{color:var(--muted);font-style:italic}
.slot .tag{font:600 11px/1 var(--mono);color:var(--gold)}
.chat{height:170px;overflow-y:auto;list-style:none;margin:0;padding:8px;background:#05090d;border:1px solid var(--line);border-radius:6px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.chat .sys{color:var(--warn)}
.chatform{display:flex;gap:6px}.chatform input{flex:1;min-width:0}
#cd{font:800 56px/1 var(--mono);color:var(--gold);text-align:center;text-shadow:0 0 18px rgba(216,178,90,.5)}
/* 게임 화면 */
#game{position:fixed;inset:0;display:none}
#cv{position:absolute;left:0;top:0;width:100%;height:calc(100% - 150px);display:block;cursor:crosshair}
#console{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(#1b2530,#0e141a);border-top:2px solid #46586b;display:grid;grid-template-columns:150px 1fr 186px;gap:10px;padding:8px}
#mini{width:134px;height:134px;background:#000;border:1px solid #46586b;cursor:pointer}
#selp{background:#070b0f;border:1px solid #2f3e4d;border-radius:4px;padding:6px;overflow:hidden;display:flex;gap:10px;align-items:center}
#selp .grid{display:grid;grid-template-columns:repeat(6,40px);gap:4px}
#selp .w{width:40px;height:40px;border:1px solid #2f3e4d;border-radius:3px;cursor:pointer}
#selp .big{display:flex;gap:12px;align-items:center}
#selp .big b{font-size:16px}
#card{display:grid;grid-template-columns:repeat(3,56px);grid-auto-rows:42px;gap:5px;align-content:start}
#card button{font-size:12px;line-height:1.1;padding:2px;border-radius:4px;background:linear-gradient(#26313d,#141b22);border:1px solid #3b4c5e;color:var(--ink);cursor:pointer}
#card button u{color:var(--warn);text-decoration:none;font-weight:700}
#card button.on{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.hud{position:absolute;pointer-events:none;text-shadow:0 1px 2px #000}
#top{right:10px;top:8px;text-align:right;font:12.5px/1.6 var(--mono);color:#cfd9e2}
#msgs{left:10px;bottom:160px;display:flex;flex-direction:column;gap:2px;font-size:14px;max-width:60vw}
#msgs div{transition:opacity .6s}
#gchat{position:absolute;left:10px;bottom:158px;width:min(460px,70vw);display:none}
#banner{left:50%;top:38%;transform:translate(-50%,-50%);font:800 44px/1.2 system-ui;color:var(--gold);text-align:center}
#endBox{position:absolute;left:50%;top:52%;transform:translateX(-50%);display:none;gap:8px}
#warn{left:50%;top:10px;transform:translateX(-50%);background:rgba(150,30,40,.9);padding:6px 14px;border-radius:99px;font-weight:600;display:none}
#menuBtn{position:absolute;left:10px;top:8px}
/* 원작 화면 (이 PC 방장 · 진짜 그래픽): 640×480 기준을 s배로 키움. 콘솔 그림의 빈 곳으로 전장이 보임 */
#game.classic #cv,#game.classic #real{height:100% !important}
#game.classic #real{image-rendering:pixelated;object-fit:fill !important;width:100% !important}
#game.classic #console{left:var(--cx);right:auto;width:calc(640px * var(--s));height:calc(var(--ch) * var(--s));background:var(--cimg) left bottom/100% 100% no-repeat;border:0;padding:0;display:block;pointer-events:none;image-rendering:pixelated}
#game.classic #mini{position:absolute;left:calc(6px * var(--s));top:calc((348px - var(--ct)) * var(--s));width:calc(128px * var(--s));height:calc(128px * var(--s));border:0;pointer-events:auto}
#game.classic #selp{position:absolute;left:calc(160px * var(--s));top:calc((392px - var(--ct)) * var(--s));width:calc(250px * var(--s));height:calc(80px * var(--s));background:transparent;border:0;pointer-events:auto;transform-origin:left top}
#game.classic #card{position:absolute;left:calc(505px * var(--s));top:calc((358px - var(--ct)) * var(--s));grid-template-columns:repeat(3,calc(40px * var(--s)));grid-auto-rows:calc(36px * var(--s));gap:calc(5px * var(--s));pointer-events:auto}
#game.classic #card button{font-size:calc(9px * var(--s));background:rgba(0,0,0,.35);border-color:rgba(120,140,90,.6)}
#game.classic #portrait{display:block !important;position:absolute;left:calc(415px * var(--s));top:calc((414px - var(--ct)) * var(--s));width:calc(60px * var(--s));height:calc(56px * var(--s));image-rendering:pixelated;object-fit:fill;pointer-events:none}
#game.classic #portrait[data-off]{visibility:hidden}
#game.classic #selp .ow{display:flex;gap:calc(8px * var(--s));align-items:flex-start;font:calc(8px * var(--s))/1.35 system-ui,sans-serif;color:#e8e8e8}
#game.classic #selp .ow canvas{width:calc(64px * var(--s));height:calc(64px * var(--s));image-rendering:pixelated}
#game.classic #selp .og{display:grid;grid-template-columns:repeat(6,calc(33px * var(--s)));gap:calc(2px * var(--s))}
#game.classic #selp .og canvas{width:calc(33px * var(--s));height:calc(33px * var(--s));image-rendering:pixelated;cursor:inherit}
#game.classic #card button{padding:0;display:grid;place-items:center}
#game.classic #card button img{width:100%;height:100%;image-rendering:pixelated}
#game.classic #msgs{bottom:calc(var(--ch) * var(--s) + 6px)}
#game.classic #gchat{bottom:calc(var(--ch) * var(--s) + 4px)}
</style>
</head>
<body>

<!-- 1. 들어가기 -->
<section class="screen" id="entry"><div class="box" style="width:min(520px,100%)">
  <h1>스타 대결</h1>
  <p class="small" id="entryNote">불러오는 중…</p>
  <label class="row"><span style="width:60px">이름</span><input type="text" id="name" maxlength="12" placeholder="예: 베니" style="flex:1"></label>
  <div class="row"><span style="width:60px">색</span><div class="swatches" id="colors"></div></div>
  <div class="row"><button class="btn go" id="enterBtn" disabled>방 만들기</button><span class="small" id="entryMsg"></span></div>
  <div id="launch" class="panel" style="display:none">
    <h2>방장으로 시작 (관리자 · 이 PC)</h2>
    <p class="small">엔진은 회원님 PC(WSL)에서만 돌아요. ① 엔진을 켜면 ② 방장 화면이 저절로 열려요.</p>
    <div class="row"><button class="btn go" id="engineOn">① PC 엔진 켜기</button><a class="btn" id="hostOpen" href="http://127.0.0.1:8810/">② 방장 화면 열기</a></div>
    <p class="small" id="engineSt">엔진 확인 중…</p>
  </div>
</div></section>

<!-- 2. 대기실 -->
<section class="screen" id="lobby" style="display:none"><div class="box">
  <div class="row" style="justify-content:space-between"><h1 id="roomTitle">대기실</h1><span class="small" id="roomInfo"></span></div>
  <div class="lobby">
    <div class="panel">
      <h2>팀 1 <span class="small" id="t0name"></span></h2><div id="team0" style="display:grid;gap:5px"></div>
      <h2>팀 2 <span class="small" id="t1name"></span></h2><div id="team1" style="display:grid;gap:5px"></div>
      <div class="row"><button class="btn" id="toT0">팀 1로</button><button class="btn" id="toT1">팀 2로</button><span class="small">사람이 없는 팀은 컴퓨터가 맡아요</span></div>
    </div>
    <div class="panel">
      <h2>판</h2>
      <select id="scn"><option value="corsair">뮤탈 12 vs 커세어 7</option><option value="scourge">뮤탈 12 vs 스커지 8</option><option value="mirror">뮤탈 12 vs 뮤탈 12</option></select>
      <p class="small" id="scnInfo"></p>
      <h2>맵</h2>
      <select id="mapSel" disabled><option>불러오는 중…</option></select>
      <p class="small" id="mapInfo"></p>
      <div class="row" id="inviteRow"><button class="btn" id="copyLink">초대 링크 복사</button></div>
      <p class="small" id="linkTxt" style="word-break:break-all;user-select:all"></p>
      <div id="cd"></div>
    </div>
  </div>
  <div class="panel"><h2>채팅</h2><ul class="chat" id="lchat"></ul>
    <form class="chatform" id="lchatForm"><input type="text" id="lchatIn" maxlength="120" placeholder="메시지 (Enter)" autocomplete="off"><button class="btn">보내기</button></form></div>
  <div class="row" style="justify-content:flex-end"><span class="small" id="lobbyMsg"></span><button class="btn" id="leaveBtn">나가기</button><button class="btn go" id="startBtn">게임 시작</button></div>
</div></section>

<!-- 3. 게임 -->
<section id="game">
  <img id="real" alt="" style="position:absolute;left:0;top:0;width:100%;height:calc(100% - 150px);object-fit:none;object-position:left top;display:none;image-rendering:pixelated">
  <canvas id="cv"></canvas>
  <button class="btn" id="menuBtn" style="padding:4px 10px;font-size:12px">메뉴 (F10)</button>
  <div class="hud" id="top"></div>
  <div class="hud" id="warn"></div>
  <div class="hud" id="msgs"></div>
  <form class="chatform" id="gchat"><input type="text" id="gchatIn" maxlength="120" placeholder="모두에게 (Enter 보내기 · ESC 닫기)" autocomplete="off"></form>
  <div class="hud" id="banner"></div>
  <div id="endBox"><button class="btn go" id="backLobby">대기실로</button><button class="btn" id="quitBtn">나가기</button></div>
  <div id="console">
    <canvas id="mini" width="268" height="268"></canvas>
    <div id="selp"></div>
    <video id="portrait" muted loop playsinline autoplay style="display:none"></video>
    <div id="card"></div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../common/glog.js?v=1"></script>
<script src="net.js?v=5"></script>
<script src="sc.js?v=16"></script>
</body>
</html>
