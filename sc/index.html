<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>스타 봇 세상</title>
<style>
/* 스타 봇 세상: 진짜 엔진(OpenBW) 창을 이 PC 에 띄우는 단추만 있는 판 (관리자 전용). 게임 화면은 PC 창 */
:root{--bg:#06080c;--line:#2c3a48;--ink:#dfe8f0;--muted:#8796a5;--gold:#d8b25a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
button,select{font:inherit}
.btn{background:linear-gradient(#26313d,#1a232c);color:var(--ink);border:1px solid #3b4c5e;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.go{background:linear-gradient(#3c6b3f,#274a2a);border-color:#5d9a61;font-weight:700}
select{background:#0b1015;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.screen{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#122030,#05070a 70%)}
.box{background:rgba(14,20,27,.94);border:1px solid #3b4c5e;border-radius:10px;padding:18px;width:min(520px,100%);display:grid;gap:12px;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.6)}
h1{margin:0;font-size:24px;color:var(--gold)}
.small{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>span:first-child{width:60px}
.row>select{flex:1}
#launch{display:none;gap:12px}
</style>
<script src="../common/backnav.js?v=3"></script>
</head>
<body>
<section class="screen"><div class="box">
  <h1>🤖 스타 봇 세상</h1>
  <p class="small" id="note">불러오는 중…</p>
  <div id="launch">
    <p class="small">진짜 스타1 엔진(OpenBW)과 공개 대회 봇. 창은 이 PC에 떠요 (관전: C = 자동 카메라 · 봇 돕기: F9 = 켬/끔).</p>
    <div class="row"><span>모드</span><select id="botMode"><option value="watch">👀 봇끼리 관전</option><option value="vs">⚔️ 나 vs 봇</option><option value="assist">🤝 나 + 내 봇 vs 봇 (봇 돕기)</option></select></div>
    <div class="row" id="botARow"><span id="botALab">봇 1</span><select id="botA"></select></div>
    <div class="row"><span>상대 봇</span><select id="botB"></select></div>
    <div class="row" id="raceRow" style="display:none"><span>내 종족</span><select id="botRace"><option>Zerg</option><option>Terran</option><option>Protoss</option></select></div>
    <div class="row"><span>맵</span><select id="botMap"><option>FightingSpirit</option><option>CircuitBreaker</option><option>Python</option><option>Destination</option><option>HeartbreakRidge</option><option>Benzene</option><option>Andromeda</option><option>TauCross</option><option>Jade</option><option>LaMancha</option></select></div>
    <div class="row"><button class="btn go" id="botGo">▶ 봇 판 시작</button><span class="small" id="botSt"></span></div>
  </div>
</div></section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="sc.js?v=18"></script>
</body>
</html>
