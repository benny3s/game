<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>스타크래프트 도전</title>
<link rel="stylesheet" href="../common/cozy.css?v=13">
<style>
/* 스타크래프트 도전 — 화면 틀은 cozy, 여기는 우주 색과 이 판에만 있는 것 */
:root{--bg:#070a16;--bg-grad:radial-gradient(120% 90% at 50% 0%,#1c1f44 0%,#0b0e22 60%,#05060f 100%);--card:rgba(18,22,48,.94);--card-border:rgba(129,140,248,.34);--ink:#eef2ff;--soft:#a5b4fc;--line:rgba(129,140,248,.22);--accent:#6366f1;--accent-d:#4338ca;--gold:#fbbf24;--paper:rgba(12,15,34,.88)}
body{background:var(--bg-grad)}
.card{display:grid;gap:12px}
h2{margin:4px 0 0;font-size:15px;color:var(--gold)}
.row>span:first-child{width:60px}
.row>select{flex:1;min-width:0}
.row>.btn.big{flex:1 1 100%}
#launch{display:none;gap:12px}
.grid2{display:grid;gap:8px}
.hidden{display:none}
ol{margin:6px 0 0;padding-left:20px}
li{margin:4px 0}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--soft)}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
.btn.go{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff;font-weight:800;text-align:left}
.btn.stop{background:linear-gradient(135deg,#7f1d1d,#5b1414);border-color:transparent;color:#fff}
</style>
<script src="../common/backnav.js?v=3"></script>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>🚀 스타크래프트 도전</h1><a href="../">게임 목록</a></header>
  <section class="card">
  <p class="small" id="note">불러오는 중…</p>
  <div id="launch">
    <p class="small">진짜 스타1 엔진(OpenBW)과 공개 대회 봇. 창은 이 PC에 떠요 (관전: C = 자동 카메라 · 봇 돕기: F9 = 켬/끔).</p>
    <div class="row"><span>모드</span><select id="botMode"><option value="watch">👀 봇끼리 관전</option><option value="vs">⚔️ 나 vs 봇</option><option value="assist">🤝 나 + 내 봇 vs 봇 (봇 돕기)</option></select></div>
    <div class="row" id="botARow"><span id="botALab">봇 1</span><select id="botA"></select></div>
    <div class="row"><span>상대 봇</span><select id="botB"></select></div>
    <div class="row" id="raceRow" style="display:none"><span>내 종족</span><select id="botRace"><option>Zerg</option><option>Terran</option><option>Protoss</option></select></div>
    <div class="row"><span>맵</span><select id="botMap"><option>FightingSpirit</option><option>CircuitBreaker</option><option>Python</option><option>Destination</option><option>HeartbreakRidge</option><option>Benzene</option><option>Andromeda</option><option>TauCross</option><option>Jade</option><option>LaMancha</option></select></div>
    <div class="row"><button class="btn primary big" id="botGo">시작!</button><span class="small" id="botSt"></span></div>
  </div>
  </section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="sc.js?v=18"></script>
</body>
</html>
