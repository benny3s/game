<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>게임 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="common/ui.css">
<style>
/* 관리자 전용: 날짜 고르기 → 세션(방) 카드마다 참가자·판 결과·연결 품질·채팅. 위에서 CSV 내려받기 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select,.bar button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.sess h3{margin:0;font-size:16px}
.sess h4{margin:4px 0 0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.n{text-align:right;font-family:var(--mono)}
.bad{color:var(--danger)}.ok{color:var(--good)}
.chat{font-size:13px;display:grid;gap:2px;max-height:180px;overflow-y:auto}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.bar button.on{background:var(--accent,#2b6);color:#fff}
#gView[hidden],#pView[hidden],#nView[hidden]{display:none!important}
tr.pr{cursor:pointer}tr.pr:hover td{background:rgba(255,255,255,.04)}
.gm{display:inline-block;margin-right:6px;white-space:nowrap}
.sum span{background:#0f1716;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <p class="crumb"><a href="./">← 게임 목록</a></p>
  <h1>게임 기록</h1>
  <p class="lede">관리자만 볼 수 있어요. 🟢 지금 누가 어떤 게임을 하는지·허용된 기기·기다리는 요청·신고를 한눈에, 사람별로 누가 언제 어떤 게임을 누구와 했는지 모아 보여요. 친구랑 방마다 누가 언제 들어오고 나갔는지, 판을 시작한 때, 채팅이 남아요 (지렁이·냥도쿠는 판 결과·연결 품질까지).</p>
  <div class="bar"><button id="tabN" class="on">🟢 지금 · 기기</button><button id="tabP">👤 사람별</button><button id="tabG">🎮 게임별</button></div>
  <div id="nView" style="display:grid;gap:12px"><p class="help" id="nMsg">불러오는 중…</p><div class="sum" id="nSum"></div><div id="nBody" style="display:grid;gap:12px"></div></div>
  <div id="pView" hidden style="display:grid;gap:12px"><p class="help" id="pMsg">불러오는 중…</p><div class="tw" id="pTable"></div><div id="pDetail" style="display:grid;gap:10px"></div></div>
  <div id="gView" hidden style="display:grid;gap:12px">
  <div class="bar">
    <select id="game"><option value="gostop">🎴 고스톱</option><option value="seotda">🀄 섯다</option><option value="poker">♠️ 홀덤</option><option value="baduk">⚫ 바둑</option><option value="omok">⚪ 오목</option><option value="cube">🀫 베니큐브</option><option value="chess">♟️ 체스</option><option value="janggi">🏯 장기</option><option value="onecard">🃏 원카드</option><option value="yut">🪵 윷놀이</option><option value="billiards">🎱 당구</option><option value="volley">🏐 냥냥 배구</option><option value="land">🟩 땅따먹기</option><option value="nyang">🐱 냥도쿠</option><option value="snake">🐍 지렁이</option><option value="draw">🎨 냥스트레이션</option><option value="catch">🖍️ 냥캐치</option><option value="sc">⚔️ 스타 대결 (옛 판 기록)</option></select>
    <select id="date"></select>
    <button id="csv">CSV 내려받기</button>
    <span class="help" id="msg">불러오는 중…</span>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list" style="display:grid;gap:12px"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FB = { apiKey: "AIzaSyCSueePQfiHaRxUSZxoropiFjiq9arAaTs", authDomain: "benny-meeting.firebaseapp.com", projectId: "benny-meeting", appId: "1:925758544707:web:a0c55e596ae0b15e7fadf6",
  databaseURL: "https://benny-meeting-default-rtdb.asia-southeast1.firebasedatabase.app" };
const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tm = t => t ? new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "-";
const dur = (a, b) => a && b ? Math.round((b - a) / 1000) + "초" : "-";
let data = {};

app.auth().onAuthStateChanged(async u => {
  if (!u || (await u.getIdTokenResult()).claims.admin !== 1) { $("msg").innerHTML = '관리자 로그인이 필요해요. <a href="https://benny3s.github.io/">포털</a>에서 Benny 를 3번 눌러 로그인한 뒤 다시 열어 주세요.'; return; }
  loadGame(); loadPeople(); loadNow();
});
const tabs = { N: "nView", P: "pView", G: "gView" };
for (const k in tabs) $("tab" + k).onclick = () => { for (const j in tabs) { $(tabs[j]).hidden = j !== k; $("tab" + j).classList.toggle("on", j === k); } };
// ── 🟢 지금 · 기기: 지금 접속 중(game_presence) · 허용된 기기(game_devices) · 기다리는 요청(game_requests) · 최근 신고(game_reports)
function loadNow() {
  const db = app.database(), ago = t => { if (!t) return "-"; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "방금" : m < 60 ? m + "분 전" : m < 1440 ? Math.round(m / 60) + "시간 전" : Math.round(m / 1440) + "일 전"; };
  const left = e => { if (!e) return "기한 없음"; const d = (e - Date.now()) / 86400000; return d < 0 ? "<span class='bad'>끝남</span>" : d < 1 ? Math.max(1, Math.round(d * 24)) + "시간 남음" : Math.round(d) + "일 남음"; };
  const data = {};
  const draw = () => {
    const pres = Object.entries(data.pres || {}).filter(([, p]) => p && Date.now() - (p.t || 0) < 6 * 60000).sort((a, b) => (b[1].t || 0) - (a[1].t || 0));
    const MODE = { admin: "👑 관리자", allowed: "✅ 허용", bridge: "💞 브릿지", guest: "👀 둘러보기" };
    const visits = Object.entries(data.pres || {}).filter(([, p]) => p && Date.now() - (p.t || 0) < 7 * 86400000).sort((a, b) => (b[1].t || 0) - (a[1].t || 0));
    const devs = Object.entries(data.devs || {}).sort((a, b) => (b[1].lastSeen || b[1].t || 0) - (a[1].lastSeen || a[1].t || 0));
    const reqs = Object.entries(data.reqs || {}).filter(([, r]) => r && r.status === "pending");
    const reps = Object.entries(data.reps || {}).sort((a, b) => (b[1].t || 0) - (a[1].t || 0)).slice(0, 15);
    $("nSum").innerHTML = `<span>🟢 지금 ${pres.length}명</span><span>📱 허용 기기 ${devs.filter(([, d]) => d.status === "active" && (!d.expiresAt || d.expiresAt > Date.now())).length}대</span><span>⏳ 기다리는 요청 ${reqs.length}</span><span>🐞 최근 신고·오류 ${reps.length}</span>`;
    $("nMsg").textContent = "실시간으로 바뀌어요 (10-31부터 둘러보기 손님까지 기기마다 한 줄 · '지금' = 6분 안. 방 링크 손님은 사람별 기록에 남아요)";
    $("nBody").innerHTML =
      `<div class="sess"><h3>🟢 지금 접속 중</h3>${pres.length ? `<div class="tw"><table><tr><th>이름</th><th>누구</th><th>게임</th><th>기기</th><th>마지막</th></tr>${pres.map(([, p]) => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(MODE[p.mode] || "")}</td><td>${esc(GNAME[p.game] || p.game)}</td><td>${esc(p.ua || "")}</td><td>${ago(p.t)}</td></tr>`).join("")}</table></div>` : '<p class="help">지금은 아무도 없어요</p>'}</div>` +
      `<div class="sess"><h3>👥 최근 방문자 (7일, ${visits.length}대)</h3>${visits.length ? `<div class="tw"><table><tr><th>이름</th><th>누구</th><th>마지막 게임</th><th>기기</th><th>마지막</th></tr>${visits.map(([, p]) => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(MODE[p.mode] || "")}</td><td>${esc(GNAME[p.game] || p.game)}</td><td>${esc(p.ua || "")}</td><td>${ago(p.t)}</td></tr>`).join("")}</table></div>` : '<p class="help">아직 없어요</p>'}</div>` +
      (reqs.length ? `<div class="sess"><h3>⏳ 허용 기다리는 요청</h3><div class="tw"><table><tr><th>이름</th><th>원하는 기간</th><th>한마디</th><th>기기</th><th>언제</th></tr>${reqs.map(([, r]) => `<tr><td><b>${esc(r.name)}</b></td><td>${esc({ day: "하루", today: "하루", week: "1주", month: "1달", always: "계속" }[r.want] || "계속")}</td><td style="white-space:normal">${esc(r.note || "")}</td><td>${esc(r.ua || "")}</td><td>${ago(r.t)}</td></tr>`).join("")}</table></div><p class="help">허용·거절은 아케이드 첫 화면 '🔔 허용 요청'에서 해요 (베니비서는 알림만)</p></div>` : "") +
      `<div class="sess"><h3>📱 허용된 기기</h3><div class="tw"><table><tr><th>이름</th><th>상태</th><th>기간</th><th>마지막 접속</th><th>기기</th></tr>${devs.map(([, d]) => `<tr><td><b>${esc(d.name || "?")}</b></td><td class="${d.status === "active" ? "ok" : "bad"}">${esc({ active: "허용", paused: "멈춤", revoked: "해제" }[d.status] || d.status || "-")}</td><td>${left(d.expiresAt)}</td><td>${ago(d.lastSeen || d.t)}</td><td>${esc(d.ua || "")}</td></tr>`).join("")}</table></div><p class="help">멈춤·해제는 포털 '👑 출입·기기 관리'에서 해요</p></div>` +
      (reps.length ? `<div class="sess"><h3>🐞 최근 신고 · 오류</h3><div class="tw"><table><tr><th>언제</th><th>종류</th><th>게임</th><th>누가</th><th>내용</th></tr>${reps.map(([, r]) => `<tr><td>${ago(r.t)}</td><td>${r.kind === "report" ? "🐞 신고" : "🧯 오류"}</td><td>${esc(GNAME[r.game] || r.game)}</td><td>${esc(r.name || "")}</td><td style="white-space:normal">${esc(String(r.msg || "").slice(0, 160))}${r.src ? ` <span class="help">${esc(r.src)}</span>` : ""}</td></tr>`).join("")}</table></div></div>` : "");
  };
  db.ref("game_presence").on("value", s => { data.pres = s.val(); draw(); }, () => {});
  db.ref("game_devices").on("value", s => { data.devs = s.val(); draw(); }, () => {});
  db.ref("game_requests").on("value", s => { data.reqs = s.val(); draw(); }, () => {});
  db.ref("game_reports").limitToLast(30).on("value", s => { data.reps = s.val(); draw(); }, () => {});
  setInterval(draw, 60000);
}
// ── 👤 사람별: 모든 게임의 친구랑 방 기록을 사람(이름) 기준으로 모음 (혼자 하기는 기록이 없어요)
const GNAME = {}; for (const o of document.querySelectorAll("#game option")) GNAME[o.value] = o.textContent;
let people = {};
async function loadPeople() {
  let all = {};
  try { all = (await app.database().ref("logs").get()).val() || {}; }
  catch (e) { $("pMsg").textContent = "읽기 실패: " + e.message; return; }
  people = {};
  for (const [game, days] of Object.entries(all)) for (const [date, ss] of Object.entries(days || {})) for (const [sid, s] of Object.entries(ss || {})) {
    const ps = s.players || {}, names = Object.values(ps).map(p => p && p.name).filter(Boolean), info = s.info || {};
    const nMatch = Object.keys(s.matches || {}).length, nChat = Object.keys(s.chat || {}).length;
    for (const p of Object.values(ps)) {
      if (!p || !p.name) continue;
      const P = people[p.name] = people[p.name] || { name: p.name, rooms: [], games: {}, with: {}, last: 0, host: 0 };
      P.rooms.push({ game, date, sid, room: info.room || "", host: info.hostName || "", role: p.role || "", joined: p.joined || info.created || 0, left: p.left || 0, nMatch, nChat, others: names.filter(n => n !== p.name) });
      P.games[game] = (P.games[game] || 0) + 1;
      for (const n of names) if (n !== p.name) P.with[n] = (P.with[n] || 0) + 1;
      P.last = Math.max(P.last, p.joined || info.created || 0);
      if (p.role === "방장") P.host++;
    }
  }
  const list = Object.values(people).sort((a, b) => b.last - a.last);
  const day = t => t ? new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }) : "-";
  $("pMsg").textContent = list.length ? `친구랑 방에 들어온 사람 ${list.length}명 · 줄을 누르면 그 사람의 방 기록` : "아직 친구랑 기록이 없어요 (혼자 하기는 기록하지 않아요)";
  $("pTable").innerHTML = list.length ? `<table><tr><th>이름</th><th>마지막</th><th>방</th><th>방장</th><th>게임</th><th>자주 같이 한 사람</th></tr>${list.map(P => {
    const gs = Object.entries(P.games).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<span class="gm">${esc(GNAME[g] || g)} ${n}</span>`).join("");
    const w = Object.entries(P.with).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, k]) => `${esc(n)}(${k})`).join(", ");
    return `<tr class="pr" data-n="${esc(P.name)}"><td><b>${esc(P.name)}</b></td><td>${day(P.last)}</td><td class="n">${P.rooms.length}</td><td class="n">${P.host}</td><td style="white-space:normal">${gs}</td><td style="white-space:normal">${w || "-"}</td></tr>`;
  }).join("")}</table>` : "";
  $("pTable").querySelectorAll("tr.pr").forEach(tr => tr.onclick = () => showPerson(tr.dataset.n));
}
function showPerson(name) {
  const P = people[name]; if (!P) return;
  const rows = P.rooms.slice().sort((a, b) => b.joined - a.joined).map(r => `<tr><td>${esc(r.date)}</td><td>${tm(r.joined)}</td><td>${dur(r.joined, r.left)}</td><td>${esc(GNAME[r.game] || r.game)}</td><td>${esc(r.room)}</td><td>${esc(r.role)}</td><td style="white-space:normal">${esc(r.others.join(", ")) || "-"}</td><td class="n">${r.nMatch}</td><td class="n">${r.nChat}</td></tr>`).join("");
  $("pDetail").innerHTML = `<div class="sess"><h3>👤 ${esc(P.name)} <span class="help">방 ${P.rooms.length}개</span></h3><div class="tw"><table><tr><th>날짜</th><th>들어옴</th><th>머문 시간</th><th>게임</th><th>방</th><th>역할</th><th>같이 한 사람</th><th>판</th><th>채팅</th></tr>${rows}</table></div></div>`;
  $("pDetail").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("game").onchange = loadGame;
$("date").onchange = render;
async function loadGame() {
  $("msg").textContent = "불러오는 중…";
  try { data = (await app.database().ref("logs/" + $("game").value).get()).val() || {}; }
  catch (e) { $("msg").textContent = "읽기 실패: " + e.message; return; }
  const dates = Object.keys(data).sort().reverse();
  $("date").innerHTML = dates.map(d => `<option>${d}</option>`).join("") || "<option value=''>기록 없음</option>";
  render();
}
function render() {
  const d = $("date").value, day = data[d] || {};
  const ss = Object.entries(day).sort((a, b) => (b[1].info?.created || 0) - (a[1].info?.created || 0));
  let matches = 0, people = new Set(), relay = 0, nets = 0;
  $("list").innerHTML = ss.map(([sid, s]) => {
    const info = s.info || {}, ps = s.players || {}, ms = Object.values(s.matches || {}), net = s.net || {}, chat = Object.values(s.chat || {});
    matches += ms.length; Object.values(ps).forEach(p => people.add(p.name)); Object.values(net).forEach(n => { nets++; if (n.conn === "Firebase") relay++; });
    const pRows = Object.entries(ps).map(([uid, p]) => `<tr><td>${esc(p.name)}</td><td>${esc(p.role || "")}${p.team != null ? " · 팀" + (p.team + 1) : ""}</td><td>${tm(p.joined)}</td><td>${tm(p.left)}</td></tr>`).join("");
    const mRows = ms.sort((a, b) => (a.start || 0) - (b.start || 0)).map((m, i) => {
      const res = m.final || m.results || [];
      const top = Array.isArray(res) ? res.slice().sort((a, b) => (b.len ?? 0) - (a.len ?? 0)).slice(0, 4).map(r => `${esc(r.n || r.name)} ${r.len ?? ""}${r.kills != null ? "·잡" + r.kills : ""}`).join(" / ") : "";
      const sc = m.winner ? `${esc(m.winner)} 승 · 남은 유닛 ${m.left1 ?? "-"}:${m.left2 ?? "-"} · ${m.secs ?? "-"}초` : "";
      return `<tr><td>${i + 1}</td><td>${tm(m.start)}</td><td>${dur(m.start, m.end || m.updated)}${m.aborted ? " (중단)" : ""}</td><td>${esc(m.mode || m.scn || m.cfg || "")}${m.ai ? " · AI " + esc(m.ai) : ""}</td><td>${esc(m.players || m.people || [m.team1, m.team2].filter(Boolean).join(" vs "))}</td><td>${sc || top}</td></tr>`;
    }).join("");
    const nRows = Object.entries(net).map(([uid, n]) => `<tr><td>${esc(n.name)}</td><td>${esc(n.role)}</td><td class="${n.conn === "Firebase" ? "bad" : "ok"}">${esc(n.conn || (n.role === "방장" ? `친구 ${n.friends ?? 0} (직접 ${n.direct ?? 0})` : "-"))}</td><td class="n">${n.ping ?? "-"}</td><td class="n">${n.pingMax ?? "-"}</td><td class="n">${n.gap ?? "-"}${n.jitter != null ? " ±" + n.jitter : ""}</td><td class="n">${n.react ?? "-"}</td><td class="n ${n.reconnects ? "bad" : ""}">${n.reconnects ?? 0}</td><td>${tm(n.updated)}</td></tr>`).join("");
    const cRows = chat.sort((a, b) => (a.t || 0) - (b.t || 0)).map(c => `<div><span class="help">${tm(c.t)}</span> <b>${esc(c.n)}</b>: ${esc(c.m)}</div>`).join("");
    return `<div class="sess"><h3>${esc(info.kind || "")} · 방 ${esc(info.room || "?")} · 방장 ${esc(info.hostName || "")} <span class="help">${tm(info.created)} ~ ${tm(info.closed || info.updated)}</span></h3>
      ${pRows ? `<h4>참가자</h4><div class="tw"><table><tr><th>이름</th><th>역할</th><th>들어옴</th><th>나감</th></tr>${pRows}</table></div>` : ""}
      ${mRows ? `<h4>판 (${ms.length})</h4><div class="tw"><table><tr><th>#</th><th>시작</th><th>길이</th><th>방식</th><th>사람</th><th>결과</th></tr>${mRows}</table></div>` : ""}
      ${nRows ? `<h4>연결 품질</h4><div class="tw"><table><tr><th>이름</th><th>역할</th><th>연결</th><th>핑 평균</th><th>핑 최대</th><th>화면 간격 ms</th><th>명령→반응</th><th>끊김</th><th>마지막</th></tr>${nRows}</table></div>` : ""}
      ${cRows ? `<h4>채팅 (${chat.length})</h4><div class="chat">${cRows}</div>` : ""}</div>`;
  }).join("") || '<p class="help">이 날 기록이 없어요.</p>';
  $("sum").innerHTML = `<span>세션 ${ss.length}</span><span>판 ${matches}</span><span>사람 ${people.size}명</span><span>Firebase 경유 ${relay}/${nets}</span>`;
  $("msg").textContent = "";
}
// CSV: 판 결과 한 줄씩 + 연결 품질 한 줄씩
$("csv").onclick = () => {
  const d = $("date").value, day = data[d] || {}, rows = [["종류", "세션", "방", "시각", "이름/판", "역할/방식", "값1", "값2", "값3", "값4", "끊김"]];
  for (const [sid, s] of Object.entries(day)) {
    const room = s.info?.room || "";
    for (const m of Object.values(s.matches || {})) for (const r of (m.final || m.results || [])) rows.push(["판", sid, room, tm(m.start), r.n || r.name || "", m.mode || m.scn || "", r.len ?? "", r.best ?? "", r.kills ?? "", r.deaths ?? "", ""]);
    for (const m of Object.values(s.matches || {})) if (m.winner) rows.push(["판", sid, room, tm(m.start), `${m.team1 || ""} vs ${m.team2 || ""}`, m.scn || "", m.winner, m.left1 ?? "", m.left2 ?? "", m.secs ?? "", ""]);
    for (const n of Object.values(s.net || {})) rows.push(["연결", sid, room, tm(n.updated), n.name || "", n.role || "", n.conn || "", n.ping ?? "", n.gap ?? "", n.react ?? "", n.reconnects ?? 0]);
  }
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `게임기록_${$("game").value}_${d}.csv`; a.click();
};
</script>
